name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secure_api
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: secure_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure_api -d secure_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://secure_api:ci-only-password@localhost:5432/secure_api
      JWT_SECRET_KEY: ci-only-secret-key-of-at-least-32-characters
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test PostgreSQL migrations
        run: |
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import inspect
          from app.database import engine
          assert 'users' in inspect(engine).get_table_names()
          print('PostgreSQL migration verified')
          PY
      - name: Run automated tests
        run: python -m pytest -q
